<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My One Page Website</title>
    <link rel="stylesheet" href="style.css">
   <style>
body {
    margin: 0;
    font-family: Arial;
}

/* NAV BAR */
nav {
    background: #333;
    padding: 15px;
    position: sticky;
    top: 0;
    text-align: center;
}

nav a {
    color: white;
    margin: 15px;
    text-decoration: none;
}

nav a:hover {
    color: orange;
}

/* SECTIONS */
section {
    padding: 80px;
    text-align: center;
}

/* COLORS */
#home { background: #f2f2f2; }
#about { background: #e0e0e0; }
#projects { background: #d0d0d0; }
#contact { background: #c0c0c0; }
}
   </style>

</head>

<body>

    <!-- NAVIGATION -->
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- HOME -->
    <section id="home">
        <h1>Welcome to My Website</h1>
        <p>This is my one-page website.</p>
    </section>

    <!-- ABOUT -->
    <section id="about">
        <h2>About Me</h2>
        <p>I am learning web development.</p>
    </section>

    <!-- PROJECTS -->
    <section id="projects">
        <h2>My Projects</h2>
        <p>Here are some sample projects.</p>
    
    
    <img src="images/plant1-small.png" alt="plant 1">
    <img src="images/plant2-small.png" alt="plant 2">
    <img src="images/plant3-small.png" alt="plant 3 ">
    <img src="images/plant4-small.png" alt="plant 4 ">
    </section>

<!-- CONTACT -->
    <section id="contact">
        <h2>Contact</h2>
        <p>Email: mahasajid813@github.com</p>
    </section>
   
</body>
 
</html>
